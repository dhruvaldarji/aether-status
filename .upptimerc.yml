# Upptime configuration for the Aether off-machine monitor (AET-385).
# Checks /health behind Cloudflare Access with a service token. The header values come from
# the repo secrets CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET.
owner: dhruvaldarji
repo: aether-status

sites:
  - name: Aether
    url: https://aether.dhruvaldarji.com/health
    expectedStatusCodes:
      - 200
    headers:
      - "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
      - "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"

workflowSchedule:
  uptime: "2-59/5 * * * *"

status-website:
  cname: status.dhruvaldarji.com
  name: Aether status
  introTitle: "Aether status"
  introMessage: Uptime of the Aether health check.
  navbar:
    - title: Status
      href: /
